name: Playwright Regression Tests

on:
  workflow_dispatch:
inputs:
  workers:
    description: 'Number of Playwright workers'
    required: true
    default: '1'

  headed:
    description: 'Run headed'
    required: true
    default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test --grep-invert @smoke
